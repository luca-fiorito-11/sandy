name: Test Sandy from Test PyPI and PyPI

on:
  workflow_dispatch:

env:
  # Path to the NJOY binary after build
  NJOY: ${{ github.workspace }}/NJOY2016/build/njoy

jobs:
  test-testpypi:
    name: Test from Test PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up NJOY2016
        uses: ./.github/actions/setup-njoy

      - name: Install Sandy from Test PyPI
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple sandy

      - name: Run tests
        run: |
          cd ..
          ls .
          pytest -v 

  test-pypi:
    name: Test from PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up NJOY2016
        uses: ./.github/actions/setup-njoy

      - name: Install Sandy from PyPI
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install sandy

      - name: Run tests
        run: |
          cd ..
          ls .
          pytest -v 
