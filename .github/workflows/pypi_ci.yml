name: Test Sandy from Test PyPI and PyPI

on:
  workflow_dispatch:

jobs:
  test-testpypi:
    name: Test from Test PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-testpypi
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Sandy from Test PyPI
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple sandy

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: |
          mkdir tests
          cd tests
          pytest -v ../sandy

  test-pypi:
    name: Test from PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pypi
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Sandy from PyPI
        run: |
          python -m pip install --upgrade pip
          pip install sandy

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: |
          mkdir tests
          cd tests
          pytest -v ../sandy
