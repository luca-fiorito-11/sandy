name: Tag and Release

# Trigger the workflow manually with an input to choose the target repository
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish target (testpypi or pypi)'
        required: true
        default: 'testpypi'

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code from the base branch
      - name: Checkout base branch
        uses: actions/checkout@v4

      # Run a custom action to check if the version is valid and unique
      - name: Check version is unique and valid
        id: check_version
        uses: ./.github/actions/check-version

      # Create and push a Git tag based on the version
      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ steps.check_version.outputs.version }}
          tag="v$version"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$tag"
          git push origin "$tag"

  release:
    name: Publish to PyPI or Test PyPI
    needs: tag
    runs-on: ubuntu-latest
    steps:
      # ✅ Checkout the repository to enable git commands
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Fetch all branches and tags
        run: git fetch --all --tags
  
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"
  
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
  
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
  
      - name: Build distribution
        run: python -m build

      - name: Report wheel and sdist sizes
        run: |
          echo "Wheel file sizes:"
          ls -lh dist/*.whl
          echo ""
          echo "Source distribution file sizes:"
          ls -lh dist/*.tar.gz

      - name: Check README rendering
        run: twine check dist/*

      - name: Test the wheel before upload
        run: |
          pip install dist/*.whl
          python -c "import sandy; print('Wheel import OK:', sandy.__version__)"

      - name: Test the sdist before upload
        run: |
          pip install dist/*.tar.gz
          python -c "import sandy; print('SDist import OK:', sandy.__version__)"
  
      - name: Publish to selected repository
        env:
          TWINE_USERNAME: ${{ github.event.inputs.target == 'pypi' && secrets.PYPI_USERNAME || secrets.PYPI_TEST_USERNAME }}
          TWINE_PASSWORD: ${{ github.event.inputs.target == 'pypi' && secrets.PYPI_PASSWORD || secrets.PYPI_TEST_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.target }}" = "pypi" ]; then
            repo_url="https://upload.pypi.org/legacy/"
          else
            repo_url="https://test.pypi.org/legacy/"
          fi
          twine upload --repository-url "$repo_url" dist/* --verbose
