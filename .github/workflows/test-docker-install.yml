name: Weekly Docker Test for Sandy

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:
  pull_request:

jobs:
  test-docker-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t sandy-test -f Dockerfile.pypi .

      - name: Run container and verify installation
        run: docker run --rm sandy-test python -c "import sandy; print(f'Sandy version {sandy.__version__} installed successfully')"
