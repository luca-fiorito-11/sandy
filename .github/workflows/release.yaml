# ------------------------------------------------------------------------------
# GitHub Actions Workflow: PyPI_test Release
#
# This workflow is designed to:
# - Trigger on either a manual dispatch (via GitHub UI) or a Git tag push.
# - Ensure the version in `sandy.__version__` matches the provided tag or input.
# - Build the Python package using `setup.cfg` and `pyproject.toml` (via `build`).
# - Upload the distribution to Test PyPI for testing purposes.
#
# Requirements:
# - `sandy.__version__` must be defined and match the release version.
# - Secrets `PYPI_TEST_USERNAME` and `PYPI_TEST_PASSWORD` must be set in the repo.
# ------------------------------------------------------------------------------

name: PyPI_test Release

on:
  push:
    tags:
      - "*"  # Trigger on all tags
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match sandy.__version__)"
        required: false
        type: string

jobs:
  release:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Cache pip dependencies from setup.cfg
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine
          pip install .[pack]

      - name: Extract version from sandy.__version__
        id: get_version
        run: |
          version=$(python -c "import sandy; print(sandy.__version__)")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Determine expected version
        id: determine_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            expected="${{ github.event.inputs.version }}"
          else
            expected="${GITHUB_REF#refs/tags/}"
          fi
          echo "expected=$expected" >> $GITHUB_OUTPUT

      - name: Compare version
        run: |
          actual="${{ steps.get_version.outputs.version }}"
          expected="${{ steps.determine_version.outputs.expected }}"
          echo "Extracted version: $actual"
          echo "Expected version: $expected"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Version mismatch: sandy.__version__ ($actual) does not match expected ($expected)"
            exit 1
          fi

      - name: Build distribution
        run: python -m build

      - name: Publish to Test PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_TEST_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST_PASSWORD }}
        run: |
          twine upload --repository-url https://test.pypi.org/legacy/ dist/* --verbose
