# ------------------------------------------------------------------------------
# GitHub Actions Workflow: PyPI_test Release
#
# - Triggers on tag push or manual dispatch
# - Ensures `sandy.__version__` matches the provided tag or input
# - Builds and uploads to Test PyPI
# ------------------------------------------------------------------------------

name: PyPI_test Release

on:
  push:
    tags:
      - "*"  # Trigger on all tags
  workflow_run:
    workflows: ["Tag Beta Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match sandy.__version__)"
        required: false
        type: string

jobs:
  release:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Fetch all branches and tags
        run: git fetch --all --tags
      
      - name: Find branch that contains the base version of the tag
        id: find_branch
        run: |
          full_tag="${GITHUB_REF#refs/tags/}"
          # Strip -betaN or other suffixes like -rc1, -alpha2, etc.
          base_version=$(echo "$full_tag" | sed -E 's/-(beta|rc|alpha)[0-9]+$//')
          echo "Base version: $base_version"
      
          # Try to find a remote branch that matches the base version
          branch=$(git branch -r --contains "refs/tags/$full_tag" | grep "origin/v$base_version" | head -n 1 | sed 's|origin/||')
      
          if [ -z "$branch" ]; then
            echo "::error::No branch found that matches base version v$base_version"
            exit 1
          fi
      
          echo "branch=$branch" >> $GITHUB_OUTPUT

      - name: Checkout branch that created the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.find_branch.outputs.branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Cache pip dependencies from setup.cfg
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Check version and ensure it's unique
        id: check_version
        uses: ./.github/actions/check-version  # path to your composite action

      - name: Determine expected version
        id: determine_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            expected="${{ github.event.inputs.version }}"
          else
            expected="${GITHUB_REF#refs/tags/}"
          fi
          echo "expected=$expected" >> $GITHUB_OUTPUT

      - name: Compare version
        run: |
          actual="${{ steps.check_version.outputs.version }}"
          expected="${{ steps.determine_version.outputs.expected }}"
          echo "Extracted version: $actual"
          echo "Expected version: $expected"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Version mismatch: sandy.__version__ ($actual) does not match expected ($expected)"
            exit 1
          fi

      - name: Build distribution
        run: python -m build

      - name: Publish to Test PyPI
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_TEST_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_TEST_PASSWORD }}
        run: |
          twine upload --repository-url https://test.pypi.org/legacy/ dist/* --verbose
