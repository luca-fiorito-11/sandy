name: Tag Beta Release

# Trigger this workflow when a pull request is closed on any branch starting with 'v'
on:
  pull_request:
    types: [closed]
    branches:
      - 'v*'

jobs:
  tag-beta:
    # Run this job only if the pull request was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the base branch (the branch the PR was merged into)
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      # Step 2: Run a custom action to check if the version is valid and unique
      - name: Check version is unique and valid
        id: check_version
        uses: ./.github/actions/check-version

      # Step 3: Ensure the version string ends with a beta suffix (e.g., -beta1)
      - name: Ensure version is a beta release
        shell: bash
        run: |
          version=${{ steps.check_version.outputs.version }}
          if [[ ! "$version" =~ -beta[0-9]+$ ]]; then
            echo "::notice::Version $version is not a beta release. Skipping tag creation."
            exit 0

      # Step 4: Create and push a Git tag from the base branch using the validated version
      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${{ steps.check_version.outputs.version }}
          tag="v$version"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$tag"
          git push origin "$tag"
