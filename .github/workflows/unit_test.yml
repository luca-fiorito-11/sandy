# Continuous Integration workflow for testing, version checking, and NJOY2016 setup

name: Continuous Integration

on:
  # Trigger on push or pull request to develop and v1.1 branches
  push:
    branches:
      - develop
      - v*
  pull_request:
    branches:
      - develop
      - v*
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

env:
  # Path to the NJOY binary after build
  NJOY: ${{ github.workspace }}/NJOY2016/build/njoy
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build, Test, and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Retrieves the source code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
        # Installs the latest Python 3.x version

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
        # Speeds up builds by caching Python packages

      - name: Setup NJOY2016
        uses: ./.github/actions/setup-njoy
        # Builds NJOY2016 from source

      - name: Install SANDY with test dependencies
        uses: ./.github/actions/install-sandy-local
        # Installs package with test extras

      - name: Run tests with coverage
        run: pytest --cov=sandy sandy -q --tb=short --disable-warnings --log-level=ERROR
        # Runs tests and reports code coverage

