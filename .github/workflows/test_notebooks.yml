name: Notebook CI

on:
  schedule:
    - cron: '30 14 * * 1'  # Every Monday 14:30 UTC
  workflow_dispatch:

env:
  NJOY: ${{ github.workspace }}/NJOY2016/build/njoy
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  execute_batches:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [batch_1, batch_2, batch_3, batch_4, batch_5]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.8 <3.12"   # serpentTools constraint

      - name: Set up NJOY2016
        uses: ./.github/actions/setup-njoy

      - name: Install SANDY with all extras
        uses: ./.github/actions/install-sandy-local-extras

      # ---- EARLY EXIT if required packaged data is missing
      - name: Verify SANDY packaged data
        run: |
          python - << 'EOF'
          import sys
          from pathlib import Path
          import sandy

          base = Path(sandy.__file__).parent / "appendix"
          checks = {
              "chain_yields": list((base / "chain_yields").glob("*")),
              "onefile_archives": list((base / "onefile_archives").glob("*.tar.xz")),
              "fycorr": list((base / "fycorr").glob("*.tar.xz")),
          }

          missing = [name for name, files in checks.items() if not files]
          if missing:
              print("\n❌ ERROR: Missing required SANDY data directories/files:\n")
              for name in missing:
                  print(f"  - {name} (expected under: {base / name})")
              print("\nWheel is missing required data. Update setup.cfg & MANIFEST.in.\n")
              sys.exit(1)

          print("✅ All required SANDY packaged data is present.")
          EOF

      - name: Execute notebooks in ${{ matrix.batch }}
        run: |
          cd notebooks/${{ matrix.batch }}
          mkdir -p executed

          echo "▶ Executing notebooks in ${{ matrix.batch }}..."
          jupyter nbconvert \
            --to notebook \
            --execute \
            --ExecutePreprocessor.kernel_name='python3' \
            --inplace \
            *.ipynb \
            > /dev/null

          mv *.ipynb executed/

      - name: Upload executed notebooks from ${{ matrix.batch }}
        uses: actions/upload-artifact@v4
        with:
          name: executed_${{ matrix.batch }}
          path: notebooks/${{ matrix.batch }}/executed/

  push_notebooks:
    needs: execute_batches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all executed notebooks
        uses: actions/download-artifact@v4
        with:
          pattern: executed_*
          path: notebooks_flat_raw

      - name: Flatten executed notebooks into one directory
        run: |
          mkdir -p notebooks_flat
          find notebooks_flat_raw -name "*.ipynb" -exec mv {} notebooks_flat/ \;

      - name: Push executed notebooks to external repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: notebooks_flat/
          destination-github-username: 'luca-fiorito-11'
          destination-repository-name: 'sandy_notebooks'
          user-email: 'lucafiorito.11@gmail.com'
          commit-message: 'Update executed notebooks'
          target-branch: 'executed_notebooks_v1.1'