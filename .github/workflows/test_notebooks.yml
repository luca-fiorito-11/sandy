      - name: Upload executed notebooks from batch_5
        uses: actions/upload-artifact@v4
        with:
          name: executed_batch_5
          path: notebooks/batch_5/executed/

  push_notebooks:
    needs: [execute_batch_1, execute_batch_2, execute_batch_3, execute_batch_4, execute_batch_5]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download executed notebooks from batch_1
        uses: actions/download-artifact@v4
        with:
          name: executed_batch_1
          path: notebooks/batch_1/executed/

      - name: Download executed notebooks from batch_2
        uses: actions/download-artifact@v4
        with:
          name: executed_batch_2
          path: notebooks/batch_2/executed/

      - name: Download executed notebooks from batch_3
        uses: actions/download-artifact@v4
        with:
          name: executed_batch_3
          path: notebooks/batch_3/executed/

      - name: Download executed notebooks from batch_4
        uses: actions/download-artifact@v4
        with:
          name: executed_batch_4
          path: notebooks/batch_4/executed/

      - name: Download executed notebooks from batch_5
        uses: actions/download-artifact@v4
        with:
          name: executed_batch_5
          path: notebooks/batch_5/executed/

      - name: Flatten executed notebooks into a single directory
        run: |
          mkdir -p notebooks_flat
          mv notebooks/batch_1/executed/*.ipynb notebooks_flat/
          mv notebooks/batch_2/executed/*.ipynb notebooks_flat/
          mv notebooks/batch_3/executed/*.ipynb notebooks_flat/
          mv notebooks/batch_4/executed/*.ipynb notebooks_flat/
          mv notebooks/batch_5/executed/*.ipynb notebooks_flat/

      - name: Push all executed notebooks
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: notebooks_flat/
          destination-github-username: 'luca-fiorito-11'
          destination-repository-name: 'sandy_notebooks'
          user-email: lucafiorito.11@gmail.com
          commit-message: pushing all executed notebooks...
          target-branch: executed_notebooks_v1.1

