name: Notebook CI

on:
  schedule:
    - cron: '30 14 * * 1'  # Mon, Wed, Fri at 14:30 UTC
  workflow_dispatch:

env:
  NJOY: ${{ github.workspace }}/NJOY2016/build/njoy
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  execute_batch_1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.8 <3.12"  # to comply with serpentTools

      - name: Set up NJOY2016
        uses: ./.github/actions/setup-njoy

      - name: Install SANDY with all extras
        uses: ./.github/actions/install-sandy-local-extras

      - name: Execute notebooks in batch_1
        run: |
          cd notebooks/batch_1
          mkdir -p executed
          jupyter nbconvert --to notebook --execute *.ipynb \
            --ExecutePreprocessor.kernel_name='python3' --inplace > /dev/null
          mv *.ipynb executed/

      - name: Upload executed notebooks from batch_1
        uses: actions/upload-artifact@v4
        with:
          name: executed_batch_1
          path: notebooks/batch_1/executed/

  execute_batch_2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.8 <3.12"  # to comply with serpentTools

      - name: Set up NJOY2016
        uses: ./.github/actions/setup-njoy

      - name: Install SANDY with all extras
        uses: ./.github/actions/install-sandy-local-extras

      - name: Execute notebooks in batch_2
        run: |
          cd notebooks/batch_2
          mkdir -p executed
          jupyter nbconvert --to notebook --execute *.ipynb \
            --ExecutePreprocessor.kernel_name='python3' --inplace > /dev/null
          mv *.ipynb executed/

      - name: Upload executed notebooks from batch_2
        uses: actions/upload-artifact@v4
        with:
          name: executed_batch_2
          path: notebooks/batch_2/executed/

  execute_batch_3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.8 <3.12"  # to comply with serpentTools

      - name: Set up NJOY2016
        uses: ./.github/actions/setup-njoy

      - name: Install SANDY with all extras
        uses: ./.github/actions/install-sandy-local-extras

      - name: Execute notebooks in batch_3
        run: |
          cd notebooks/batch_3
