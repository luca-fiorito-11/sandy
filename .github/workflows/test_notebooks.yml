      - name: Upload executed notebooks from batch_3
        uses: actions/upload-artifact@v4
        with:
          name: executed_batch_3
          path: notebooks/batch_3/executed/

  execute_batch_4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ">=3.8 <3.12"  # to comply with serpentTools

      - name: Set up NJOY2016
        uses: ./.github/actions/setup-njoy

      - name: Install SANDY with all extras
