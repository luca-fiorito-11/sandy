name: Weekly Docker Test for Sandy

on:
  pull_request:
    # branches:
    #   - develop
    #   - v*
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  test-docker-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --build-arg INSTALL_MODE=source -t sandy-source .

      - name: Run container and verify installation
        run: docker run --rm sandy-source python -c "import sandy; print(f'Sandy version {sandy.__version__} installed successfully')"
