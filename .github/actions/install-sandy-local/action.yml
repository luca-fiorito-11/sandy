name: Install SANDY with test dependencies
description: Installs the SANDY package with test extras

runs:
  using: "composite"
  steps:
    - name: Install SANDY
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        pip install --upgrade pip setuptools wheel
        pip install --no-cache-dir .
        pip install --no-cache-dir .[test]
        